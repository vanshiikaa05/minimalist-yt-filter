<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header matched with main heading style, vertically centered -->
  <div id="month-year-display" style="text-align: left; padding: 16px 20px; background-color: #fff5f7; color: #4a154b; font-size: 15px; font-weight: 500; letter-spacing: -0.3px; border-bottom: 2px solid rgba(74, 21, 75, 0.1);"></div>
  
  <!-- Calendar at Top -->
  <div class="top-grid" id="calendar-grid"></div>
  
  <div class="content">
    <p class="eyebrow">PREFERENCES</p>
    <h1 class="main-heading">From clutter to clarity: Leveraging filters to streamline your feed.</h1>
    
    <div class="slider-container" style="margin-bottom: 15px;">
      <label for="percent">Hide videos watched over: <span id="percent-val">50%</span></label>
      <input type="range" id="percent" min="10" max="100" value="50" class="aesthetic-slider">
    </div>

    <div class="slider-container" style="margin-bottom: 25px;">
      <label for="views">Hide if seen in feed: <span id="views-val">3 times</span></label>
      <input type="range" id="views" min="1" max="10" value="3" class="aesthetic-slider">
    </div>

    <button class="save-btn">Apply Filter</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
